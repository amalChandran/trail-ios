name: Native Swift
on: [push, pull_request]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check.sh
      - run: ./scripts/test-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-native-reports
          path: |
            artifacts/*tests.*
            Examples/build/*.xcresult
